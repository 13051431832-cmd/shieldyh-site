<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Desk 技能市场 — 200+ AI 编程技能免费装</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface-hover: #252525;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --text-dim: #999;
    --accent: #d4a574;
    --accent-glow: #e8c48a;
    --green: #5ecb90;
    --yellow: #d9a845;
    --red: #e05570;
    --blue: #6ba4e0;
    --purple: #b490e0;
    --font: "SF Mono", "Fira Code", "JetBrains Mono", "Menlo", monospace;
    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ─────────────── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    backdrop-filter: blur(12px);
  }

  .logo {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .logo span { color: var(--text-dim); font-weight: 400; }

  .search-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 16px;
    color: var(--text);
    font-family: var(--font);
    font-size: 0.9rem;
    width: 320px;
    max-width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar:focus { border-color: var(--accent); }
  .search-bar::placeholder { color: var(--text-dim); }

  /* ── Top Navigation ──────── */
  .top-nav {
    display: flex;
    gap: 4px;
  }
  .nav-item {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.9rem;
    padding: 6px 16px;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .nav-item:hover { color: var(--text); background: var(--surface); }
  .nav-item.active { color: var(--accent); background: var(--surface); }

  /* ── Stats bar ──────────── */
  .stats-bar {
    padding: 12px 40px;
    display: flex;
    gap: 24px;
    color: var(--text-dim);
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stats-bar strong { color: var(--text); }

  /* ── Layout ─────────────── */
  main {
    display: flex;
    min-height: calc(100vh - 140px);
  }

  /* ── Sidebar ────────────── */
  aside {
    width: 240px;
    border-right: 1px solid var(--border);
    padding: 20px 0;
    flex-shrink: 0;
  }
  .cat-item {
    display: block;
    padding: 6px 24px;
    color: var(--text-dim);
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .cat-item:hover { color: var(--text); background: var(--surface); }
  .cat-item.active { color: var(--accent); border-right: 2px solid var(--accent); }
  .cat-item .count { float: right; color: var(--text-dim); font-size: 0.8rem; }

  /* ── Content ────────────── */
  .content {
    flex: 1;
    padding: 24px 40px;
    overflow-y: auto;
    max-height: calc(100vh - 140px);
  }
  .content h2 {
    font-size: 1.4rem;
    margin-bottom: 8px;
    color: var(--accent);
  }
  .content .subtitle {
    color: var(--text-dim);
    margin-bottom: 24px;
    font-size: 0.9rem;
  }

  /* ── Skill card ─────────── */
  .skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px;
  }
  .skill-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: all 0.2s;
    cursor: default;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .skill-card:hover {
    border-color: var(--accent);
    background: var(--surface-hover);
  }
  .skill-card .name {
    font-weight: 700;
    color: var(--accent);
    font-size: 1rem;
  }
  .skill-card .desc {
    color: var(--text-dim);
    font-size: 0.85rem;
    flex: 1;
  }
  .skill-card .meta {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .skill-card .meta .tag {
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
  }
  .skill-card .meta .tag.deps { color: var(--yellow); }
  .skill-card .meta .tag.paid { color: var(--accent); border: 1px solid var(--accent); }
  .skill-card.paid-card { border-color: rgba(212,167,116,0.3); }
  .skill-card .paid-action {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
  }
  .skill-card .paid-price {
    background: rgba(212,167,116,0.15);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .skill-card .buy-btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 16px;
    font-family: var(--font);
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .skill-card .buy-btn:hover {
    background: var(--accent);
    color: #000;
  }
  .install-bar .close-bar {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.4rem;
    cursor: pointer;
    padding: 0 4px;
  }
  .install-bar .close-bar:hover { color: var(--accent); }
  .skill-card .install-cmd {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.8rem;
    color: var(--green);
    cursor: pointer;
    word-break: break-all;
    transition: all 0.15s;
  }
  .skill-card .install-cmd:hover {
    border-color: var(--accent);
    color: var(--accent-glow);
  }
  .skill-card .install-cmd .prompt { color: var(--text-dim); }

  /* ── Empty state ────────── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty h3 { color: var(--accent); margin-bottom: 8px; }

  /* ── Install bar ────────── */
  .install-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--accent);
    padding: 16px 40px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    z-index: 20;
  }
  .install-bar.visible { display: flex; }
  .install-bar .selected-count {
    color: var(--accent);
    font-weight: 700;
  }
  .install-bar pre {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: var(--radius);
    color: var(--green);
    font-size: 0.85rem;
    flex: 1;
  }
  .install-bar button {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: var(--radius);
    padding: 10px 24px;
    font-family: var(--font);
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .install-bar button:hover { background: var(--accent-glow); }

  /* ── Toast ──────────────── */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #000;
    padding: 10px 24px;
    border-radius: var(--radius);
    font-weight: 700;
    font-size: 0.9rem;
    z-index: 30;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ── Responsive ─────────── */
  @media (max-width: 768px) {
    aside { display: none; }
    .content { padding: 16px; }
    header { padding: 12px 16px; }
    .stats-bar { padding: 8px 16px; }
    .skill-grid { grid-template-columns: 1fr; }
    .search-bar { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="window.location='/'">ccb skill<span>://store</span></div>
  <nav class="top-nav">
    <a class="nav-item active" href="/skills.html">技能市场</a>
    <a class="nav-item" href="/">Deep Desk</a>
  </nav>
  <input class="search-bar" type="text" placeholder="Search skills ..." id="search" autofocus>
</header>

<div class="stats-bar" id="stats"></div>

<main>
  <aside id="sidebar"></aside>
  <div class="content" id="content">
    <div class="empty"><h3>Loading catalog...</h3></div>
  </div>
</main>

<div class="install-bar" id="installBar">
  <span class="selected-count" id="selectedCount">0 selected</span>
  <pre id="installCmd">ccb skill install</pre>
  <button onclick="copyInstallCmd()">Copy</button>
  <button class="close-bar" onclick="hideInstallBar()">&times;</button>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
let catalog = { skills: [] };
let selected = new Set();
let activeCategory = 'all';

// ── Category labels ───────
const CAT_LABELS = {
  frontend:'前端开发', backend:'后端开发', testing:'测试',
  security:'安全', 'code-quality':'代码质量', 'ai-agent':'AI/Agent',
  devops:'DevOps', design:'设计/品牌', business:'商业/数据',
  programming:'编程语言', tools:'效率工具', other:'其他'
};

// ── Load catalog ──────────
async function init() {
  try {
    const resp = await fetch('catalog.json');
    catalog = await resp.json();
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="empty"><h3>Catalog not available</h3><p>Run build-catalog.sh first</p></div>';
    return;
  }
  renderStats();
  renderSidebar();
  renderSkills(catalog.skills);
  document.getElementById('search').addEventListener('input', onSearch);
}

// ── Stats ─────────────────
function renderStats() {
  const total = catalog.total;
  const cats = new Set(catalog.skills.map(s => s.category));
  document.getElementById('stats').innerHTML =
    `<span><strong>${total}</strong> skills</span>` +
    `<span><strong>${cats.size}</strong> categories</span>` +
    `<span>Updated: <strong>${catalog.version}</strong></span>`;
}

// ── Sidebar ───────────────
function renderSidebar() {
  const counts = {};
  catalog.skills.forEach(s => counts[s.category] = (counts[s.category]||0)+1);
  let html = `<a class="cat-item active" onclick="filterCategory('all')">All<span class="count">${catalog.total}</span></a>`;
  for (const [cat, n] of Object.entries(counts).sort((a,b) => b[1]-a[1])) {
    html += `<a class="cat-item" onclick="filterCategory('${cat}')">${CAT_LABELS[cat]||cat}<span class="count">${n}</span></a>`;
  }
  document.getElementById('sidebar').innerHTML = html;
}

// ── Render ────────────────
function renderSkills(skills) {
  if (skills.length === 0) {
    document.getElementById('content').innerHTML =
      '<div class="empty"><h3>No skills found</h3><p>Try a different search or category</p></div>';
    return;
  }

  const catLabel = activeCategory === 'all' ? 'All Skills' : (CAT_LABELS[activeCategory]||activeCategory);
  let html = `<h2>${catLabel}</h2><p class="subtitle">${skills.length} skills</p><div class="skill-grid">`;

  for (const s of skills) {
    const checked = selected.has(s.name) ? 'checked' : '';
    const depNote = s.has_node_modules
      ? `<span class="tag deps">has deps</span>`
      : '';
    const paidNote = s.paid
      ? `<span class="tag paid">paid</span>`
      : '';
    const cardClass = s.paid ? 'skill-card paid-card' : 'skill-card';
    const nameHtml = s.paid ? `&#x1f512; ${esc(s.name)}` : esc(s.name);
    const cmdHtml = s.paid
      ? `<span class="prompt">$</span> ccb skill install-paid &lt;key&gt; ${esc(s.name)}`
      : `<span class="prompt">$</span> ccb skill install ${esc(s.name)}${s.has_node_modules?' --with-deps':''}`;
    const buyBtn = s.paid
      ? `<div class="paid-action"><span class="paid-price">付费</span><a class="buy-btn" href="/product.html?skill=${escAttr(s.name)}">Get License</a></div>`
      : '';
    html += `
<div class="${cardClass}">
  <div class="name">${nameHtml}</div>
  <div class="desc">${esc(s.description)}</div>
  <div class="meta">
    <span>${s.size_human}</span>
    <span class="tag">${CAT_LABELS[s.category]||s.category}</span>
    ${depNote}
    ${paidNote}
    <span class="tag">${esc(s.origin)}</span>
  </div>
  <div class="install-cmd" onclick="copyText(this)" title="Click to copy install command">
    ${cmdHtml}
  </div>
  ${buyBtn}
</div>`;
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

// ── Filter ────────────────
function filterCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.cat-item').forEach(el => {
    if (el.textContent.startsWith(cat === 'all' ? 'All' : (CAT_LABELS[cat]||cat))) {
      el.classList.add('active');
    }
  });
  const skills = cat === 'all'
    ? catalog.skills
    : catalog.skills.filter(s => s.category === cat);
  renderSkills(skills);
  document.getElementById('search').value = '';
}

// ── Search ────────────────
function onSearch(e) {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { filterCategory(activeCategory); return; }
  const results = catalog.skills
    .map(s => {
      let score = 0;
      if (s.name.toLowerCase().includes(q)) score += 10;
      if (s.description.toLowerCase().includes(q)) score += 5;
      if ((CAT_LABELS[s.category]||'').includes(q)) score += 3;
      return { score, skill: s };
    })
    .filter(r => r.score > 0)
    .sort((a,b) => b.score - a.score)
    .map(r => r.skill);
  renderSkills(results);
}

// ── Selection & copy ──────
function copyText(el) {
  // Copy the command from the element's text, stripping the prompt prefix
  const cmd = el.textContent.replace(/^\$\s*/, '').trim();
  navigator.clipboard.writeText(cmd).then(() => toast('Copied!'));
}

function copyInstallCmd() {
  const cmd = document.getElementById('installCmd').textContent;
  navigator.clipboard.writeText(cmd).then(() => toast('Copied!'));
}

function showBuyBar(name) {
  document.getElementById('installCmd').textContent = 'ccb skill install-paid <key> ' + name;
  document.getElementById('installBar').classList.add('visible');
}

function hideInstallBar() {
  document.getElementById('installBar').classList.remove('visible');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function esc(s) { return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return (s||'').replace(/'/g,"\\'"); }

// ── Boot ──────────────────
init();
</script>
</body>
</html>
